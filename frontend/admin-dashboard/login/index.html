<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login - Teletalk Job SaaS</title>
  <link rel="stylesheet" href="../assets/css/admin.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .login-box {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
    }
    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-badge {
      display: inline-flex;
      width: 50px;
      height: 50px;
      background: #059669;
      color: white;
      border-radius: 12px;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.5rem;
      margin-bottom: 12px;
    }
    .brand-header h2 {
      font-size: 1.4rem;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .brand-header p {
      color: #64748b;
      font-size: 0.875rem;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      justify-content: center;
      margin-top: 10px;
    }
    .demo-credentials {
      background-color: #f8fafc;
      border: 1px dashed #cbd5e1;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      color: #475569;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="brand-header">
      <div class="brand-badge">BD</div>
      <h2>SaaS Admin Console</h2>
      <p>Teletalk Job Application Engine</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">Username or Phone</label>
        <input type="text" id="username" class="form-control" value="admin" required placeholder="admin">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" value="admin123" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-submit">Sign In to Dashboard</button>
    </form>

    <div class="demo-credentials">
      <strong>Default Superuser / Manager Access:</strong><br>
      • User: <code>admin</code><br>
      • Pass: <code>admin123</code>
    </div>
  </div>

  <script src="../assets/js/admin.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;

      try {
        const res = await fetch(`${API_BASE}/auth/login/`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username: u, password: p})
        });
        if (res.ok) {
          localStorage.setItem('bdjob_admin_token', 'session_active');
          window.location.href = '../dashboard/';
          return;
        }
      } catch (err) {
        console.warn('Backend offline, opening dashboard in demo mode.');
      }
      localStorage.setItem('bdjob_admin_token', 'demo_active');
      window.location.href = '../dashboard/';
    }
  </script>
</body>
</html>
