<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teletalk Job Autofill BD</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="brand-logo">BD</div>
        <div class="brand-info">
          <h1>Teletalk Autofill</h1>
          <span class="version-tag">v1.0 • Bangladesh Govt Jobs</span>
        </div>
      </div>
      <button id="btn-open-options-header" class="icon-btn" title="Open Full Profile Editor">
        ⚙️
      </button>
    </header>

    <!-- Site Status Card -->
    <div class="status-card" id="site-status-card">
      <div class="status-indicator" id="status-indicator"></div>
      <div class="status-text">
        <span class="status-title" id="status-title">Checking page...</span>
        <span class="status-subtitle" id="status-subtitle">Looking for Teletalk form</span>
      </div>
    </div>

    <!-- Quick Profile Summary & Switcher -->
    <div class="profile-pill-card">
      <div class="profile-info" style="display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0;">
        <span class="profile-label">Profile:</span>
        <select id="popup-profile-select" class="popup-profile-select" title="Switch Active Candidate Profile">
          <!-- Populated dynamically -->
        </select>
      </div>
      <div style="display: flex; align-items: center; gap: 4px;">
        <span class="profile-completion-badge" id="profile-completion">0%</span>
        <button id="btn-popup-new-profile" class="icon-pill-btn" title="Add New Candidate Profile">➕</button>
      </div>
    </div>

    <!-- Primary Action -->
    <div class="action-section">
      <button id="btn-autofill" class="btn btn-primary btn-large" disabled>
        <span class="btn-icon">⚡</span>
        <span id="autofill-btn-text">Autofill Form</span>
      </button>

      <div class="quick-toggles">
        <label class="toggle-control" title="Allow or disable filling on pages">
          <input type="checkbox" id="toggle-enable-autofill" checked />
          <span class="toggle-track"></span>
          <span class="toggle-label">Autofill Enabled</span>
        </label>
        <label class="checkbox-control" title="Overwrite fields that already have values">
          <input type="checkbox" id="chk-overwrite-existing" />
          <span class="checkbox-label">Overwrite existing</span>
        </label>
      </div>
    </div>

    <!-- Results Panel (Visible after autofill) -->
    <div class="results-panel" id="results-panel" style="display: none;">
      <div class="results-header">
        <h3>Autofill Summary</h3>
        <span class="results-timestamp" id="results-time"></span>
      </div>
      <div class="results-badges">
        <div class="result-badge badge-filled">
          <span class="badge-count" id="count-filled">0</span>
          <span class="badge-name">Filled</span>
        </div>
        <div class="result-badge badge-skipped">
          <span class="badge-count" id="count-skipped">0</span>
          <span class="badge-name">Skipped</span>
        </div>
        <div class="result-badge badge-review">
          <span class="badge-count" id="count-review">0</span>
          <span class="badge-name">Needs Review</span>
        </div>
      </div>
      <div class="results-detail-toggle">
        <button id="btn-toggle-details" class="link-btn">Show itemized details ▼</button>
      </div>
      <div class="results-details-list" id="results-details-list" style="display: none;">
        <!-- Filled, skipped, and review items rendered here -->
      </div>
    </div>

    <!-- Quick Utility Actions -->
    <div class="utility-grid">
      <button id="btn-open-options" class="btn btn-secondary">
        <span>✏️</span> Edit Profile
      </button>
      <button id="btn-inspect-page" class="btn btn-secondary" title="Inspect input elements and IDs on current page">
        <span>🔍</span> Inspect Fields
      </button>
      <button id="btn-export-quick" class="btn btn-secondary" title="Export profile backup">
        <span>💾</span> Export Backup
      </button>
      <button id="btn-import-quick" class="btn btn-secondary" title="Import profile backup">
        <span>📂</span> Import Backup
      </button>
    </div>

    <input type="file" id="file-import-input" accept=".json" style="display: none;" />

    <!-- Danger Zone Reset -->
    <div class="footer-actions">
      <button id="btn-reset-profile" class="btn-danger-link">
        Reset Profile Data
      </button>
    </div>
  </div>

  <!-- Diagnostics Modal -->
  <div id="diagnostics-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Page Field Diagnostics</h3>
        <button id="btn-close-diagnostics" class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <p class="modal-desc">Fields detected on this page (useful for configuring new Teletalk circulars):</p>
        <div id="diagnostics-list" class="diagnostics-list"></div>
      </div>
      <div class="modal-footer">
        <button id="btn-copy-diagnostics" class="btn btn-secondary">Copy JSON Report</button>
        <button id="btn-close-diagnostics-footer" class="btn btn-primary">Done</button>
      </div>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="validation.js"></script>
  <script src="popup.js"></script>
</body>
</html>
